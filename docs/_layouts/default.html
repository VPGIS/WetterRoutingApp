<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12656f">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="assets/css/style.css?v={{ site.github.build_revision }}">
    <style>
      :root {
        --brand: #12656f;
        --brand-dark: #0a3d45;
        --accent: #d98c1f;
        --ink: #21313c;
        --muted: #637282;
        --line: #d8e1e8;
        --surface: #f6f8fa;
      }

      body {
        color: var(--ink);
      }

      .page-header {
        background: linear-gradient(135deg, var(--brand-dark), var(--brand));
        padding: 3rem 1rem 2.25rem;
      }

      .brand-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 112px;
        height: 112px;
        padding: 0.35rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        background: #fff;
        box-sizing: border-box;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }

      .brand-logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .project-name {
        margin-bottom: 0.35rem;
      }

      .project-tagline {
        margin-bottom: 1.4rem;
        opacity: 0.92;
      }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.45rem;
        max-width: 980px;
        margin: 0 auto;
      }

      .site-nav a {
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 6px;
        padding: 0.48rem 0.72rem;
        font-size: 0.92rem;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.08);
      }

      .site-nav a:hover,
      .site-nav a:focus {
        background: rgba(255, 255, 255, 0.18);
        text-decoration: none;
      }

      .main-content {
        max-width: 980px;
      }

      .main-content h1,
      .main-content h2,
      .main-content h3 {
        color: var(--brand-dark);
      }

      .main-content a {
        color: var(--brand);
      }

      .main-content table {
        display: table;
        width: 100%;
      }

      .doc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
        margin: 1.2rem 0 2rem;
      }

      .doc-card {
        display: block;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(25, 42, 55, 0.06);
      }

      .doc-card:hover,
      .doc-card:focus {
        border-color: var(--brand);
        box-shadow: 0 8px 24px rgba(18, 101, 111, 0.14);
        text-decoration: none;
      }

      .doc-card strong {
        display: block;
        margin-bottom: 0.35rem;
        color: var(--brand-dark);
      }

      .doc-card span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .info-band {
        border-left: 4px solid var(--accent);
        background: var(--surface);
        padding: 1rem 1.2rem;
        margin: 1.2rem 0;
      }

      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin: 1rem 0 1.8rem;
      }

      .quick-links a {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.45rem 0.7rem;
        text-decoration: none;
        background: #fff;
      }

      .site-footer {
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .page-header {
          padding-top: 2rem;
        }

        .brand-logo {
          width: 88px;
          height: 88px;
        }
      }
    </style>
  </head>
  <body>
    <section class="page-header">
      <a class="brand-logo" href="./" aria-label="Zur Startseite">
        <img src="assets/logo.jpg" alt="Logo der Wetter Routing App">
      </a>
      <h1 class="project-name">{{ site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      <nav class="site-nav" aria-label="Hauptnavigation">
        <a href="./">Start</a>
        <a href="about.html">About</a>
        <a href="installation.html">Installation</a>
        <a href="startup.html">Startup</a>
        <a href="architecture.html">Architektur</a>
        <a href="routing.html">Routing</a>
        <a href="weather-data.html">Wetterdaten</a>
      </nav>
    </section>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span>Wetter Routing App · Tobias Schulthess und Ignaz Kuczynski</span>
      </footer>
    </main>
  </body>
</html>
